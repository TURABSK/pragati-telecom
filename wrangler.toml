# Pragati Telecom - Cloudflare Pages Configuration
# Production Architecture: Cloudflare Pages with Pages Functions (functions/api/)

name = "pragati-telecom"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Configurable environment variables
# Model options: "gemini-1.5-flash" (default stable) or "gemini-2.0-flash"
[vars]
GEMINI_MODEL = "gemini-1.5-flash"

# SECURITY NOTICE:
# DO NOT place GEMINI_API_KEY in this file or any committed file.
# Configure your encrypted secret via Cloudflare Dashboard:
# Cloudflare Dashboard -> Workers & Pages -> pragati-telecom -> Settings -> Variables and Secrets -> Add Secret
# Secret Name: GEMINI_API_KEY
